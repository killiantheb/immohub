[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function call in argument defaults (FastAPI Depends pattern)
    "B904",   # raise-without-from-inside-except — too noisy for FastAPI HTTPException pattern
    "SIM102", # nested if — sometimes clearer than single if
    "SIM105", # suppress — try/except/pass is more explicit here
    "SIM117", # allow nested with
    "F841",   # local variable assigned but never used — 7 legacy violations,
              # TODO Phase 1.1 cleanup. Re-activer dès que la dette est purgée
              # (cf chore/ruff-autofix 2026-05-13 — partie des 105 erreurs
              # non auto-fixables laissées telles quelles).
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402", "F401", "I001"]
"app/models/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
no_strict_optional = true
explicit_package_bases = true
exclude = ["alembic/", "venv/", "\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "app.routers.ai",
    "app.schemas.auth",
    "app.services.company_service",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
